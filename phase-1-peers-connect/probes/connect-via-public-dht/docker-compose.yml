# DIAGNOSTIC (Phase-1 historical): two nodes on the PUBLIC Holepunch DHT.
#
# Bisect for the Phase 1 connection wall — if they connect HERE but not on our
# private bootstrap, the fault is private-DHT holepunch coordination, not our
# code or Docker UDP. (Result: they don't connect — same-host shared NAT. See
# run.log + ../../journey/phase-1-peers-connect.md.) Config via .env (.env.example).
services:
  pub-node-a:
    image: ${APP_IMAGE}
    init: true
    container_name: pub-node-a
    command: ["node.js", "pub-node-a", "public", "${TOPIC}", "both"]
  pub-node-b:
    image: ${APP_IMAGE}
    init: true
    container_name: pub-node-b
    command: ["node.js", "pub-node-b", "public", "${TOPIC}", "both"]
