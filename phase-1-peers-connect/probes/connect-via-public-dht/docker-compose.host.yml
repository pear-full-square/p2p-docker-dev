# Variant: the same two public-DHT nodes, but with HOST networking — they share
# the host's network stack, like two bare-metal terminal nodes. If this connects
# but the bridged version doesn't, Docker's per-container netns isolation is the
# suspect. (Result: also no connect on this host. See run.log.) Config via .env.
services:
  host-node-a:
    image: ${APP_IMAGE}
    init: true
    network_mode: host
    container_name: host-node-a
    command: ["node.js", "host-node-a", "public", "${TOPIC}", "both"]
  host-node-b:
    image: ${APP_IMAGE}
    init: true
    network_mode: host
    container_name: host-node-b
    command: ["node.js", "host-node-b", "public", "${TOPIC}", "both"]
