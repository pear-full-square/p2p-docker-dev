# Phase 5 — managed code distribution. A private DHT bootstrap + a MANAGER that
# seeds role-code AND an assignment manifest into a signed Hyperdrive + WORKERS
# that replicate, self-assign, and run their role(s) + a CLIENT that calls them.
#
# 5.2 — protomux connection substrate. worker-a is assigned BOTH echo and reverse
# (assignments.json) and serves each on its own named protomux channel; the client
# asks for both services and reaches worker-a on ONE connection, opening one channel
# per service. Replication rides the same kind of connection — no second swarm, no
# topic-routing. Single concern: the substrate + multi-role-per-worker. (Discovery
# is unchanged from 5.1; the worker-identity discovery model is left open.)
#
# Trust anchor: the manager derives its drive from CLUSTER_SEED; the worker is
# configured with the public DRIVE_KEY only. Config is parameterised via .env.

x-node: &node
  build: .
  image: p2p-docker-dev:5.2
  init: true
  restart: "no"
  networks: [cluster]

services:
  bootstrap:
    <<: *node
    container_name: bootstrap
    command: ["bootstrap.js", "${BOOTSTRAP_PORT}", "${BOOTSTRAP_IP}"]
    networks:
      cluster:
        ipv4_address: ${BOOTSTRAP_IP}

  manager:
    <<: *node
    container_name: manager
    command: ["manager.js", "${CLUSTER_SEED}", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}"]
    depends_on: [bootstrap]

  # One worker assigned BOTH roles (see assignments.json) — multi-role-per-worker.
  worker-a:
    <<: *node
    container_name: worker-a
    command: ["worker.js", "worker-a", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}", "${DRIVE_KEY}", "${EXEC}"]
    depends_on: [bootstrap, manager]

  # One client asking for both services — reaches worker-a on one connection, a
  # named channel per service.
  client:
    <<: *node
    container_name: client
    command: ["client.js", "client", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}", "echo,reverse"]
    depends_on: [bootstrap, worker-a]

networks:
  cluster:
    ipam:
      config:
        - subnet: ${CLUSTER_SUBNET}
