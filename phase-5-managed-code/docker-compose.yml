# Phase 5 — managed code distribution. A private DHT bootstrap + a MANAGER that
# seeds role-code + a signed REGISTRY (name -> {key, roles}) into a Hyperdrive +
# WORKERS that replicate, self-assign, and serve their role(s) + a CLIENT.
#
# 5.3 — worker identity + connect-by-key. Each worker's swarm uses a derived identity
# keypair, so it is reachable BY KEY (not only via service topics). Both worker-a and
# worker-b run echo; the client resolves worker-b's key from the signed registry and
# connects to it directly (swarm.joinPeer) — targeting a SPECIFIC worker. The reply
# (echo@worker-b) proves which node served it. Single concern: identity + the base
# "target a specific node" op.
#
# Trust anchor: the manager derives the drive + worker keys from CLUSTER_SEED; workers
# get only their own derived identity secret. Config is parameterised via .env.

x-node: &node
  build: .
  image: p2p-docker-dev:5.3
  init: true
  restart: "no"
  networks: [cluster]

services:
  bootstrap:
    <<: *node
    container_name: bootstrap
    command: ["bootstrap.js", "${BOOTSTRAP_PORT}", "${BOOTSTRAP_IP}"]
    networks:
      cluster:
        ipv4_address: ${BOOTSTRAP_IP}

  manager:
    <<: *node
    container_name: manager
    command: ["manager.js", "${CLUSTER_SEED}", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}"]
    depends_on: [bootstrap]

  # Two workers, both running echo (per the registry) — each a keyed identity.
  worker-a:
    <<: *node
    container_name: worker-a
    command: ["worker.js", "worker-a", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}", "${DRIVE_KEY}", "${WORKER_A_SEED}", "${EXEC}"]
    depends_on: [bootstrap, manager]

  worker-b:
    <<: *node
    container_name: worker-b
    command: ["worker.js", "worker-b", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}", "${DRIVE_KEY}", "${WORKER_B_SEED}", "${EXEC}"]
    depends_on: [bootstrap, manager]

  # Targets a specific worker by key (resolved from the registry), not "any echo".
  client:
    <<: *node
    container_name: client
    command: ["client.js", "client", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}", "${DRIVE_KEY}", "${TARGET_WORKER}", "${TARGET_SERVICE}"]
    depends_on: [bootstrap, worker-a, worker-b]

networks:
  cluster:
    ipam:
      config:
        - subnet: ${CLUSTER_SUBNET}
