# Phase 1 — a private DHT bootstrap + a few nodes that join a topic and connect.
#
# The bootstrap gets a fixed IP: udx (the DHT transport) targets an IP, not a
# Docker hostname, so nodes are pointed at 172.28.0.10:49737 directly. Flat
# bridge ⇒ no NAT between nodes (real hole-punch/traversal is Chapter 8).
#
# init: true puts tini at PID 1 so SIGTERM (compose down / docker stop) reaches
# Bare; each process catches it via bare-signals and exits cleanly (emits stop).

x-node: &node
  build: .
  image: p2p-docker-dev:2.0
  init: true
  restart: "no"
  networks: [cluster]

services:
  bootstrap:
    <<: *node
    container_name: bootstrap
    command: ["bootstrap.js", "49737", "172.28.0.10"]
    networks:
      cluster:
        ipv4_address: 172.28.0.10

  node-a:
    <<: *node
    container_name: node-a
    command: ["node.js", "node-a", "172.28.0.10:49737", "spl6-phase2", "server"]
    depends_on: [bootstrap]

  node-b:
    <<: *node
    container_name: node-b
    command: ["node.js", "node-b", "172.28.0.10:49737", "spl6-phase2", "client"]
    depends_on: [bootstrap]

networks:
  cluster:
    ipam:
      config:
        - subnet: 172.28.0.0/16
