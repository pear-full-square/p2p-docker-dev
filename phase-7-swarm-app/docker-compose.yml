# Phase 7 — swarm app. General-purpose node containers: each is a swarm
# membership manager providing HTTP API, browser UI, and FUSE drive mount.
#
# The seed's corestore lives on a Docker volume (persistent). The peer's
# store is ephemeral. Both mount their Hyperdrive via FUSE, propagated to host.
# Host exposure requires `sudo mount --make-rshared /` on WSL2.

x-node: &node
  build: .
  image: p2p-docker-dev:7.0
  init: true
  restart: "no"
  privileged: true
  devices:
    - /dev/fuse
  networks: [swarm]

services:
  seed:
    <<: *node
    container_name: swarm-seed
    command: ["seed/seed.js", "${CLUSTER_SEED}", "${BOOTSTRAP_PORT}", "${BOOTSTRAP_IP}", "--http", "8080", "--url", "http://${EXTERNAL_HOST}:8080"]
    environment:
      - STORE_PATH=/data/corestore
      - FUSE_MOUNT=/mnt/host/drive
    ports:
      - "8080:8080"
    volumes:
      - seed-data:/data/corestore
      - ${FUSE_HOST_DIR:-./mnt}/seed:/mnt/host:rshared
    networks:
      swarm:
        ipv4_address: ${BOOTSTRAP_IP}

  peer:
    <<: *node
    container_name: swarm-peer
    command: ["peer/peer.js", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}", "${DRIVE_KEY}", "--http", "8080", "--url", "http://${EXTERNAL_HOST}:8081", "--seed-url", "http://${BOOTSTRAP_IP}:8080", "--name", "peer"]
    environment:
      - STORE_PATH=/tmp/peer-store
      - FUSE_MOUNT=/mnt/host/drive
      - DRIVE_KEY=${DRIVE_KEY}
    ports:
      - "8081:8080"
    volumes:
      - ${FUSE_HOST_DIR:-./mnt}/peer:/mnt/host:rshared
    depends_on: [seed]

networks:
  swarm:
    ipam:
      config:
        - subnet: ${CLUSTER_SUBNET}

volumes:
  seed-data:
