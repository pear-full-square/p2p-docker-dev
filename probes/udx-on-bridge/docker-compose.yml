# Ground-truth: container-to-container UDX (no DHT). The echo script is mounted
# into the app image (which already carries udx-native). If udx-client logs a
# 'pong', the bridge passes UDP between containers and the Phase 1 connection
# failure is HyperDHT holepunch coordination — not Docker networking.
#
# Config is parameterised via .env (see .env.example); run.sh auto-creates it.
services:
  udx-server:
    image: ${APP_IMAGE}
    init: true
    container_name: udx-server
    volumes:
      - ./udx-echo.js:/app/udx-echo.js:ro
    command: ["udx-echo.js", "server", "${UDX_PORT}"]
    networks:
      udxnet:
        ipv4_address: ${UDX_SERVER_IP}

  udx-client:
    image: ${APP_IMAGE}
    init: true
    container_name: udx-client
    volumes:
      - ./udx-echo.js:/app/udx-echo.js:ro
    command: ["udx-echo.js", "client", "${UDX_SERVER_IP}:${UDX_PORT}"]
    depends_on: [udx-server]
    networks: [udxnet]

networks:
  udxnet:
    ipam:
      config:
        - subnet: ${UDX_SUBNET}
