# Phase 2 — a private DHT bootstrap + an RPC server node + an RPC client node.
#
# Cluster config (subnet, bootstrap address/port, topic) is parameterised via
# environment variables — copy .env.example to .env and adjust. No environment
# specifics are hardcoded here. (capture.sh auto-creates .env from .env.example.)
#
# The bootstrap gets a fixed IP because udx (the DHT transport) targets an IP,
# not a Docker hostname. Flat bridge ⇒ no NAT between nodes (real traversal is
# Chapter 8). init: true ⇒ tini at PID 1 so SIGTERM reaches Bare for a clean stop.

x-node: &node
  build: .
  image: p2p-docker-dev:2.0
  init: true
  restart: "no"
  networks: [cluster]

services:
  bootstrap:
    <<: *node
    container_name: bootstrap
    command: ["bootstrap.js", "${BOOTSTRAP_PORT}", "${BOOTSTRAP_IP}"]
    networks:
      cluster:
        ipv4_address: ${BOOTSTRAP_IP}

  node-a:
    <<: *node
    container_name: node-a
    command: ["node.js", "node-a", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}", "${TOPIC}", "server"]
    depends_on: [bootstrap]

  node-b:
    <<: *node
    container_name: node-b
    command: ["node.js", "node-b", "${BOOTSTRAP_IP}:${BOOTSTRAP_PORT}", "${TOPIC}", "client"]
    depends_on: [bootstrap]

networks:
  cluster:
    ipam:
      config:
        - subnet: ${CLUSTER_SUBNET}
